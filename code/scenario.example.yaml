name: storage-access-evaluation
objective: Evaluate unmonitored paths available to the starting service account
operator: human-operator@example.com
target_scope: projects/replace-with-authorized-sandbox-project

# Canonical remote resource prepared for this controlled scenario.
infrastructure:
  path: projects/replace-with-authorized-sandbox-project/buckets/replace-with-bucket

starting_service_account:
  identity: starting-service-account@replace-with-project.iam.gserviceaccount.com
  credential_ref: run/default
  permissions:
    # These must be the effective permissions already known at target_scope.
    - storage.objects.get

# Select an exact detection profile for reproducible validation.
detections:
  sources:
    - sigma
  strict: true

# Optional reproducibility controls. Values omitted here use the .env/default configuration.
model:
  name: gemini-3.6-flash
  fallback_models:
    - gemini-3.1-flash-lite
  api_mode: generate_content
  thinking_level: medium
  timeout_seconds: 45
  maximum_attempts: 2
  heartbeat_seconds: 5

# DeepSeek Harness owns the persistent coding session after technique selection.
# This example routes its OpenAI-compatible adapter to Gemini; set api_key_env to
# DEEPSEEK_API_KEY and base_url to https://api.deepseek.com/ for DeepSeek models.
copilot:
  enabled: true
  model: gemini-3.6-flash
  api_key_env: GEMINI_API_KEY
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  timeout_seconds: 300
  maximum_repairs: 3

# The isolated, automatically-scored evaluation harness is a separate pipeline; see
# evaluation-pipeline/scenario.yaml and its own entrypoint.
