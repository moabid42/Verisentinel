[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iam-coverage-planner"
version = "0.1.0"
description = "Human-gated GCP IAM planning with Boolean detection coverage validation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "google-auth>=2.40,<3",
  "google-genai>=2.16,<3",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "PyYAML>=6.0,<7",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "z3-solver>=4.15,<5",
]

[project.scripts]
verisentinel = "runner.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "core",
  "ingestion",
  "environment",
  "validator",
  "proposer",
  "green_agent",
  "launchpad",
  "execution",
  "runner",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
